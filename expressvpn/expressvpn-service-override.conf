# Install via: systemctl edit expressvpn.service
# (this drops a file at /etc/systemd/system/expressvpn.service.d/override.conf,
# which is the immutable-OS-safe way to do this on Bazzite -- it never
# touches anything under /usr)
[Service]
Environment=LD_PRELOAD=/usr/local/lib/evpn_flatpak_shim.so
